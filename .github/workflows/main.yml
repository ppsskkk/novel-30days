name: 每日小说解读

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京时间每天早上 7:00
  workflow_dispatch:
    inputs:
      action:
        description: "split=拆分全书(只跑一次) / gen=生成今天一集"
        required: true
        default: "gen"

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openai markdown requests

      - name: 拆分全书（仅手动选择 split 时）
        if: github.event.inputs.action == 'split'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/split_novel.py

      - name: 生成、排版、配图、发邮件
        if: github.event.inputs.action != 'split'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/generate.py
          python scripts/format_wechat.py
          python scripts/illustrate.py
          python scripts/send_email.py
          
      - name: 提交结果和进度
        run: |
          git config user.name "novel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "更新 $(date +'%F %T')" || echo "无更新"
          git push
